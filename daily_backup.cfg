event manager applet DAILY_BACKUP
 event timer cron cron-entry "0 18 * * *"
 action 1.0 puts "***Starting Backup***"
 action 2.0 cli command "enable"
 action 2.1 cli command "terminal length 0"
 action 2.2 cli command "dir flash:daily_backup.cfg"
 action 3.0 if $_cli_result ne "" 
 action 3.1 cli command "delete /force flash:daily_backup.cfg"
 action 3.2 puts "***Deleted old backup***"
 action 3.3 end
 action 4.0 cli command "show run | redirect flash:hourly_backup.cfg"
 action 4.1 puts "***BACKUP COMPLETED***"