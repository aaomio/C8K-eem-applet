event manager applet INT_RE_ENABLE
 event syslog pattern "LINEPROTO-5-UPDOWN.*down"

 action 1.0 regexp "Interface ([^,]+)" "$syslog_msg" INT
 action 2.0 puts "$INT has been disabled. Attempting re-enable"

 action 3.0 cli command "enable"
 action 3.1 cli command "terminal length 0"

 action 4.0 cli command "dir flash:Err.cfg"
 action 4.1 if $_cli_result ne ""
 action 4.2 cli command "delete /force flash:Err.cfg"
 action 4.3 puts "Removed old error log"
 action 4.4 end

 action 5.0 cli command "show ip int br | redirect flash:Err.cfg"

 action 6.0 cli command "conf t"
 action 6.1 cli command "$INT"
 action 6.2 cli command "shut"
 action 6.3 cli command "no shut"

 action 7.0 cli command "dir flash:Update.cfg"
 action 7.1 if $_cli_result ne ""
 action 7.2 cli command "delete /force flash:Update.cfg"
 action 7.3 puts "Removed old update log"
 action 7.4 end

 action 8.0 cli command "end"
 action 8.1 cli command "show ip int br | redirect flash:Update.cfg"

 action 9.0 syslog msg "***$INT has been recovered***"