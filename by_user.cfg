event manager applet CONFIGURED_BY
 event syslog pattern "%SYS-5-CONFIG_I:.*Configured from .* by .*"

 action 1.0 puts "***Change detected***"

 action 2.0 regexp "by ([^ ]+)" "$_syslog_msg" BY User

 action 3.0 cli command "enable"
 action 3.1 cli command "terminal length 0"
 action 3.2 cli command "dir flash:$User.cfg"

 action 4.0 if $_cli_result ne ""
 action 4.1 cli command "delete /force flash:$User.cfg"
 action 4.2 puts "Removed old file saved $User"
 action 4.3 end

 action 5.0 cli command "show run | redirect flash:$User.cfg"
 action 6.0 puts "New file created by $User"
 action 7.0 syslog msg "Changes saved to flash:$User.cfg"